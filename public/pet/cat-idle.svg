<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- PetPomo cat: IDLE (sitting, eyes open, tail sways) -->
  <!-- Recolor via CSS: .fur, .fur-dark, .belly, .line -->
  <g id="cat">
    <g id="tail">
      <path class="fur" fill="#F2A65A" d="M148 158 q34 -6 30 -40 q-2 -16 -16 -18 q-10 -1 -11 9 q-1 9 8 11 q6 2 5 8 q-2 16 -22 20 z"/>
      <path class="fur-dark" fill="#E8894A" d="M166 106 q8 2 10 12 l-9 3 q-2 -8 -7 -10 z"/>
    </g>
    <g id="body">
      <ellipse class="fur" fill="#F2A65A" cx="100" cy="140" rx="46" ry="42"/>
      <ellipse class="belly" fill="#FBE8D3" cx="100" cy="150" rx="26" ry="26"/>
      <ellipse class="fur" fill="#F2A65A" cx="72" cy="172" rx="13" ry="9"/>
      <ellipse class="fur" fill="#F2A65A" cx="128" cy="172" rx="13" ry="9"/>
      <path class="line" fill="#4A3728" d="M66 172 h4 M72 172 h4" stroke="#4A3728" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g id="head">
      <g id="ears">
        <path class="fur" fill="#F2A65A" d="M58 62 L52 28 L82 46 z"/>
        <path class="fur" fill="#F2A65A" d="M142 62 L148 28 L118 46 z"/>
        <path fill="#F7C6A3" d="M62 55 L59 37 L76 47 z"/>
        <path fill="#F7C6A3" d="M138 55 L141 37 L124 47 z"/>
      </g>
      <circle class="fur" fill="#F2A65A" cx="100" cy="78" r="44"/>
      <path class="fur-dark" fill="#E8894A" d="M84 38 q4 12 -2 18 l-8 -6 q6 -4 4 -12 z"/>
      <path class="fur-dark" fill="#E8894A" d="M116 38 q-4 12 2 18 l8 -6 q-6 -4 -4 -12 z"/>
      <g id="eyes">
        <ellipse class="line" fill="#4A3728" cx="84" cy="78" rx="5" ry="7"/>
        <ellipse class="line" fill="#4A3728" cx="116" cy="78" rx="5" ry="7"/>
        <circle fill="#FFFFFF" cx="86" cy="75" r="1.8"/>
        <circle fill="#FFFFFF" cx="118" cy="75" r="1.8"/>
      </g>
      <g id="muzzle">
        <path fill="#F7A8B8" d="M96 90 q4 -3 8 0 q-1 5 -4 5 q-3 0 -4 -5 z"/>
        <path class="line" fill="none" stroke="#4A3728" stroke-width="2" stroke-linecap="round" d="M100 95 q0 4 -5 5 M100 95 q0 4 5 5"/>
      </g>
      <g id="whiskers" class="line" stroke="#4A3728" stroke-width="1.4" stroke-linecap="round" opacity="0.7">
        <path d="M58 84 h-16 M60 92 h-14"/>
        <path d="M142 84 h16 M140 92 h14"/>
      </g>
      <circle fill="#F5B8C4" opacity="0.55" cx="70" cy="92" r="6"/>
      <circle fill="#F5B8C4" opacity="0.55" cx="130" cy="92" r="6"/>
    </g>
  </g>
</svg>
