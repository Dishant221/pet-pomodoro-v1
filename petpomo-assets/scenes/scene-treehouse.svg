<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" preserveAspectRatio="xMidYMax slice">
  <!-- PetPomo scene: TREE HOUSE. Layers: #layer-sky #layer-back #layer-mid #layer-front. Fly #bird across, sway #leaves -->
  <g id="layer-sky">
    <rect fill="#D9EEF7" width="800" height="450"/>
    <circle fill="#F9E79B" cx="140" cy="80" r="30"/>
    <g fill="#FFFFFF" opacity="0.9">
      <ellipse cx="560" cy="70" rx="44" ry="16"/><ellipse cx="594" cy="62" rx="26" ry="12"/>
    </g>
    <g id="bird" transform="translate(420 110)">
      <path fill="#7FA6C9" d="M0 0 q8 -8 16 0 q-8 2 -16 0 z"/>
      <path fill="#5C87AF" d="M4 0 q6 6 14 3 q-2 5 -9 4 q-6 -1 -5 -7 z"/>
      <circle fill="#4A3728" cx="14" cy="-1" r="1.2"/>
    </g>
  </g>
  <g id="layer-back">
    <g id="far-trees" fill="#A8CBB4" opacity="0.8">
      <circle cx="640" cy="300" r="60"/><rect x="632" y="330" width="16" height="60"/>
      <circle cx="740" cy="280" r="50"/><rect x="733" y="310" width="14" height="70"/>
    </g>
    <rect id="trunk" fill="#8C6A4A" x="60" y="0" width="70" height="450" rx="14"/>
    <path d="M74 60 q12 40 0 90 M96 140 q10 50 0 100" stroke="#7A5A3E" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <g id="layer-mid">
    <g id="canopy" fill="#6FA867">
      <ellipse id="leaves" cx="240" cy="60" rx="180" ry="80"/>
      <ellipse cx="60" cy="90" rx="120" ry="70" fill="#5C8F55"/>
      <ellipse cx="420" cy="40" rx="140" ry="60" fill="#8CC17F"/>
    </g>
    <g fill="#E8A0B4">
      <circle cx="180" cy="70" r="5"/><circle cx="300" cy="50" r="4"/><circle cx="100" cy="100" r="5"/>
    </g>
    <g id="branch">
      <path fill="#8C6A4A" d="M110 250 q220 -26 560 -10 q30 2 30 16 q0 12 -28 12 q-340 8 -562 6 z"/>
      <path d="M300 246 q8 10 0 18 M480 244 q8 10 0 16" stroke="#7A5A3E" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  <g id="layer-front">
    <g id="platform">
      <rect fill="#C9A377" x="150" y="330" width="500" height="22" rx="8"/>
      <g fill="#B58F63">
        <rect x="170" y="333" width="6" height="16" rx="2"/><rect x="240" y="333" width="6" height="16" rx="2"/>
        <rect x="310" y="333" width="6" height="16" rx="2"/><rect x="380" y="333" width="6" height="16" rx="2"/>
        <rect x="450" y="333" width="6" height="16" rx="2"/><rect x="520" y="333" width="6" height="16" rx="2"/>
        <rect x="590" y="333" width="6" height="16" rx="2"/>
      </g>
      <rect fill="#8C6A4A" x="180" y="352" width="12" height="98" rx="4"/>
      <rect fill="#8C6A4A" x="600" y="352" width="12" height="98" rx="4"/>
      <g id="railing">
        <rect fill="#A8794F" x="150" y="296" width="500" height="9" rx="4"/>
        <rect fill="#A8794F" x="200" y="300" width="8" height="32" rx="3"/>
        <rect fill="#A8794F" x="320" y="300" width="8" height="32" rx="3"/>
        <rect fill="#A8794F" x="440" y="300" width="8" height="32" rx="3"/>
        <rect fill="#A8794F" x="560" y="300" width="8" height="32" rx="3"/>
      </g>
    </g>
    <g id="lantern">
      <path stroke="#4A3728" stroke-width="2.4" d="M640 296 v18" fill="none"/>
      <rect fill="#F2C879" x="630" y="314" width="20" height="24" rx="5"/>
      <ellipse fill="#F9E3A8" opacity="0.55" cx="640" cy="326" rx="26" ry="20"/>
    </g>
    <g id="hanging-leaves" fill="#8CC17F">
      <path d="M700 0 q-10 60 8 100 q14 -50 -8 -100 z"/>
      <path d="M740 0 q-8 44 6 76 q12 -40 -6 -76 z" fill="#6FA867"/>
    </g>
    <g id="snack-slot">
      <rect fill="#A8794F" x="210" y="312" width="70" height="9" rx="4"/>
      <path fill="#E8894A" d="M230 300 q9 -12 22 0 q5 7 -2 11 h-18 q-7 -4 -2 -11 z"/>
    </g>
  </g>
</svg>
