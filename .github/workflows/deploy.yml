name: Deploy

# Deploys to Cloudflare Workers (Static Assets) — migrated from Pages
# 2026-08-22. Two separate Workers, chosen by the --env flag:
#
#   push to main      ->  wrangler deploy --env production  ->  Worker `petpomo`
#                         petpomo.totadedishant.workers.dev (custom domain
#                         www.pomodoropet.com attaches here when live)
#   push to testing   ->  wrangler deploy --env preview     ->  Worker `petpomo-preview`
#                         petpomo-preview.totadedishant.workers.dev
#
# Each environment binds its own D1 database in wrangler.toml (petpomo /
# petpomo-preview). The old Pages project `petpomo` is kept as the rollback
# path — its pages.dev URLs keep serving the last Pages deploy against the
# same databases. Do not delete it until well after the domain cutover.
#
# The CLOUDFLARE_API_TOKEN repo secret must carry Workers Scripts:Edit
# permission (the old one was created for Pages deploys and may not).

on:
  push:
    branches: [main, testing]
  workflow_dispatch:
  # Daily rebuild for the blog drip. The build decides which posts are live by
  # comparing each post's publishedAt to the build time (src/blog/util.ts
  # isLive), so with no code change a fresh build each morning is what makes the
  # day's next post appear. A scheduled run checks out the default branch
  # (main), so it deploys production. 05:30 UTC — a quiet hour, after midnight
  # in the Americas so "today's" post is up early everywhere.
  schedule:
    - cron: '30 5 * * *'

# A second push while one is mid-deploy would race, and for the same branch the
# older run's output is already stale, so drop it rather than let it land after.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Least privilege: the job only reads the repo. wrangler-action talks to
    # Cloudflare, not to the GitHub Deployments API, so nothing else is needed.
    permissions:
      contents: read

    steps:
      # Third-party actions are pinned to full commit SHAs (what the v4 tags
      # pointed at on 2026-09-12). A tag can be moved to malicious code; a SHA
      # cannot. Dependabot (.github/dependabot.yml) proposes bumps.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck before deploying, not after. A broken build that reaches
      # production is far more expensive than a failed workflow run.
      - run: npm run check

      # PUBLIC_SITE_URL decides two things that must not be wrong: the absolute
      # canonical / Open Graph URLs, and whether the build marks itself
      # noindex. Preview is publicly reachable, so a preview that thinks it is
      # production would compete with the real site for its own keywords.
      - run: npm run build
        env:
          PUBLIC_SITE_URL: >-
            ${{ github.ref_name == 'main' && 'https://www.pomodoropet.com' || 'https://petpomo-preview.totadedishant.workers.dev' }}
          # Renders the "Continue with Google" button. Server-side the provider
          # exists only where the GOOGLE_* secrets are set (both envs, 2026-08-22).
          PUBLIC_GOOGLE_LOGIN: '1'

      # The first-load JS budget, enforced rather than aspired to. Three.js is
      # three quarters of the ceiling on its own, so the split that keeps it out
      # of the critical path is one careless static import away from being
      # undone — and nothing about the page would look broken when it was.
      - run: npm run budget

      - name: Deploy to Cloudflare Workers
        # Receives CLOUDFLARE_API_TOKEN, so this one especially must stay SHA-pinned.
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy --env ${{ github.ref_name == 'main' && 'production' || 'preview' }}
