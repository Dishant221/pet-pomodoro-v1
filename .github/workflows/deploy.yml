name: Deploy

# Cloudflare's own Git integration is not available here: this Pages project
# was created as a Direct Upload project, and Cloudflare does not let one be
# connected to a repository after the fact. This workflow does the same job —
# push a branch, get a deploy — while keeping the existing project and its two
# URLs intact.
#
#   push to main      ->  www.pomodoropet.com        (production, D1 petpomo)
#   push to testing   ->  preview.petpomo.pages.dev  (preview,    D1 petpomo-preview)
#
# Production is still the Pages project's `main` deployment — the custom
# domain is attached to it in the Cloudflare dashboard, and petpomo.pages.dev
# keeps serving the same deploy with a canonical pointing at the domain.
#
# The environment is chosen entirely by the --branch flag passed to wrangler.
# Cloudflare treats the project's production branch (main) as production and
# every other branch name as preview, and wrangler.toml binds a different D1
# database to each.

on:
  push:
    branches: [main, testing]
  workflow_dispatch:

# A second push while one is mid-deploy would race, and for the same branch the
# older run's output is already stale, so drop it rather than let it land after.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck before deploying, not after. A broken build that reaches
      # production is far more expensive than a failed workflow run.
      - run: npm run check

      # PUBLIC_SITE_URL decides two things that must not be wrong: the absolute
      # canonical / Open Graph URLs, and whether the build marks itself
      # noindex. Preview is publicly reachable, so a preview that thinks it is
      # production would compete with the real site for its own keywords.
      - run: npm run build
        env:
          PUBLIC_SITE_URL: >-
            ${{ github.ref_name == 'main' && 'https://www.pomodoropet.com' || 'https://preview.petpomo.pages.dev' }}

      # The first-load JS budget, enforced rather than aspired to. Three.js is
      # three quarters of the ceiling on its own, so the split that keeps it out
      # of the critical path is one careless static import away from being
      # undone — and nothing about the page would look broken when it was.
      - run: npm run budget

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name petpomo
            --branch ${{ github.ref_name == 'main' && 'main' || 'preview' }}
