<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" preserveAspectRatio="xMidYMax slice">
  <!-- PetPomo scene: GARDEN. Layers: #layer-sky #layer-back #layer-mid #layer-front. Animate #clouds x-drift, #butterfly path, sway .flower -->
