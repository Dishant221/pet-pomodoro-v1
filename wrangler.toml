#:schema node_modules/wrangler/config-schema.json
#
# Workers Static Assets deployment — migrated from Cloudflare Pages 2026-08-22.
# (Cloudflare: "Start new projects with Workers." Pages also rejected four
# things this project needs next: Cron Triggers, the rate-limit binding,
# Email Workers, and defining Durable Objects.)
#
# THE TOP LEVEL IS LOCAL DEV ONLY and is never deployed: deploys always pass
# --env preview or --env production (see package.json and deploy.yml). The
# name below is deliberately wrong-looking so a stray bare `wrangler deploy`
# creates an obviously-misnamed third Worker instead of silently overwriting
# production with a config that has no AI binding.
name = "petpomo-dev"
main = "worker/src/entry.ts"
compatibility_date = "2026-05-01"
# Required by better-auth (AsyncLocalStorage). Inheritable — applies to every
# environment. Added as its own change and regression-tested before any auth
# code landed, so a runtime difference could be attributed to it alone.
compatibility_flags = ["nodejs_compat"]

# Static assets: everything Astro emits into dist. Only /api/* invokes the
# Worker; every other URL is served straight from the asset store, which is
# also where public/_headers and public/_redirects are honoured. They are NOT
# applied to Worker-generated responses — exactly as on Pages, where _headers
# never touched Function responses either. Inheritable, so it applies to both
# environments below.
[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Cron stub, handled by the no-op scheduled() in worker/src/entry.ts.
# Analytics rollups and the moderation digest will land here in later phases.
# Inheritable.
[triggers]
crons = ["17 3 * * *"]

# ---------------------------------------------------------------------------
# Local dev. `wrangler dev` simulates D1 locally (miniflare); the id below is
# never contacted from here.
#
# Workers AI is DELIBERATELY NOT DECLARED at this level. Unlike D1 it has no
# local emulation: an [ai] block here makes `wrangler dev` open a *remote*
# connection at startup, and it was measured hanging every local request on
# this machine for exactly that reason. It is declared per-environment below,
# which deploys read and local dev never loads. Local /api/ask falls back to
# its own reaction table — a tested path, and the same one a deploy without
# AI takes.
#
# Now that this is a Worker (not Pages), an ASK_LIMIT [[ratelimits]] binding
# is finally *possible* — Pages rejected the key outright. It is still not
# declared yet: the D1 `bumpLimit` upsert is the tested atomic limiter, and
# swapping it for the binding is its own change, not part of the migration.
# worker/src/index.ts already prefers ASK_LIMIT when bound.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "petpomo"
database_id = "f2668cba-dfff-4865-b09a-80dfec61e1e4"
migrations_dir = "worker/migrations"

# Sessions + better-auth's rate limiter. Local dev simulates KV in miniflare;
# the id below (the preview namespace's) is never contacted from here.
[[kv_namespaces]]
binding = "KV_SESSIONS"
id = "b7ec452e4c994b679352d4962fce60de"

[vars]
# Same-origin deploys need no allowlist. Set this only if you split the API
# onto its own origin, e.g. "https://www.pomodoropet.com".
ALLOWED_ORIGINS = ""
# Model ids are retired on their own schedule, so this is a var rather than a
# constant in the source. Empty means "use the default in worker/src/index.ts".
ASK_MODEL = ""
# The origin better-auth trusts and builds callbacks against. MUST match the
# origin users actually hit — it is restated per environment below.
AUTH_ORIGIN = "http://localhost:4332"

# ---------------------------------------------------------------------------
# Preview. Deployed by `wrangler deploy --env preview` as its own Worker,
# `petpomo-preview`, on workers.dev. It gets its own database so testing
# cannot corrupt or read real players' saves.
#
# d1_databases and vars are non-inheritable: overriding either one for an
# environment means every non-inheritable key must be restated for it. That
# is why both blocks are repeated verbatim-shaped below and again under
# production.
# ---------------------------------------------------------------------------
[env.preview]
name = "petpomo-preview"
workers_dev = true

[[env.preview.d1_databases]]
binding = "DB"
database_name = "petpomo-preview"
database_id = "c1ec69f6-c242-4085-8e14-d55335a34a4f"
migrations_dir = "worker/migrations"

# Workers AI for /api/ask. Safe to declare here, unlike at the top level:
# `wrangler dev` reads the top-level config only, so this binding reaches the
# deployed preview without dragging a remote AI connection into local dev.
[env.preview.ai]
binding = "AI"

[[env.preview.kv_namespaces]]
binding = "KV_SESSIONS"
id = "b7ec452e4c994b679352d4962fce60de"

[env.preview.vars]
ALLOWED_ORIGINS = ""
ASK_MODEL = ""
# Email plumbing (worker/src/mail.ts) — BOTH empty until Workers Paid +
# Email Sending domain onboarding exist; every email path no-ops cleanly.
# MAIL_FROM: the verified sender, e.g. "support@pomodoropet.com".
# ADMIN_EMAIL: where contact-form and moderation-digest notifications go.
MAIL_FROM = ""
ADMIN_EMAIL = ""
AUTH_ORIGIN = "https://petpomo-preview.totadedishant.workers.dev"

# ---------------------------------------------------------------------------
# Production. Deployed by `wrangler deploy --env production` as the Worker
# `petpomo`. Serves on workers.dev until www.pomodoropet.com is live, at which
# point the custom domain attaches to this Worker (dashboard → Workers →
# petpomo → Settings → Domains & Routes). The old Pages project keeps serving
# petpomo.pages.dev untouched as the rollback path — do not delete it.
# ---------------------------------------------------------------------------
[env.production]
name = "petpomo"
workers_dev = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "petpomo"
database_id = "f2668cba-dfff-4865-b09a-80dfec61e1e4"
migrations_dir = "worker/migrations"

[env.production.ai]
binding = "AI"

[[env.production.kv_namespaces]]
binding = "KV_SESSIONS"
id = "9138bb32aead46b18d73f8fa81fa422f"

[env.production.vars]
ALLOWED_ORIGINS = ""
ASK_MODEL = ""
# Origin-bound: rotate to https://www.pomodoropet.com at the #56 domain
# cutover (with the Google OAuth redirect URI and Turnstile hostnames).
# Until the domain is live, auth ships on PREVIEW ONLY — this value is the
# production Worker's own workers.dev origin so nothing breaks if deployed.
AUTH_ORIGIN = "https://petpomo.totadedishant.workers.dev"
