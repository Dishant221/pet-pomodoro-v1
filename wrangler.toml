#:schema node_modules/wrangler/config-schema.json
name = "petpomo"
compatibility_date = "2026-05-01"
pages_build_output_dir = "dist"

# ---------------------------------------------------------------------------
# Production. Top-level config is what the production branch (main) deploys
# with, and it is also what `wrangler pages dev` uses locally.
#
# D1 holds nothing but opaque save blobs keyed by a client-generated secret.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "petpomo"
database_id = "f2668cba-dfff-4865-b09a-80dfec61e1e4"

# Workers AI, for /api/ask — the endpoint that decides how the pet reacts to
# being spoken to. It is the only thing in this project that costs money per
# call, so the endpoint rate-limits per address and caps per day.
#
# DELIBERATELY NOT DECLARED AT THIS LEVEL, because top-level is also what
# `wrangler pages dev` uses. An `[ai]` block here is not a local binding: unlike
# D1, Workers AI has no local emulation, so wrangler opens a *remote* connection
# for it at startup, making `wrangler pages dev` — and with it `npm run
# test:sync`, which drives the real Pages runtime — depend on being logged in,
# online, and entitled to Workers AI. It was measured hanging every request on
# this machine for exactly that reason.
#
# It is declared per-environment instead, under `[env.preview.ai]` below, which
# deploys reach but local dev never loads. Local dev therefore stays clean and
# /api/ask falls back to its own reaction table there — a tested path, and the
# same one a deploy without AI takes.
#
# DO NOT go back to binding it only in the dashboard. That was the previous
# advice here and it does not hold: for a Pages project with a config file,
# `wrangler pages deploy` replaces the whole deployment config for the target
# environment with what this file says. A dashboard-added AI binding survives
# until the next deploy and is then silently dropped — observed exactly that
# way, with /api/ask answering `"model": false` from a preview that had been
# bound by hand minutes earlier.

# The burst limit on /api/ask was going to be Cloudflare's own rate limiter,
# bound as ASK_LIMIT, because it is atomic where the edge cache counter is not
# and every call past the limit is a billed inference.
#
# IT CANNOT LIVE HERE. Pages rejects the key outright, and not just the binding
# — the whole deploy fails validation before a single asset is uploaded:
#
#   X [ERROR] Running configuration file validation for Pages:
#       - Configuration file for Pages projects does not support "ratelimits"
#
# So /api/ask runs on the fallback the endpoint already had: the same
# best-effort edge-cache counter used elsewhere in the Worker, with the daily
# budget cap unchanged behind it. `c.env.ASK_LIMIT` being undefined is a
# supported path in worker/src/index.ts, not an accident.
#
# A WAF rate-limiting rule is not the way out either, and this is worth writing
# down because the obvious advice is wrong here. WAF rules are configured per
# *zone*, and this account has no zones: the site is served from
# `*.pages.dev`, which is Cloudflare's own domain, not the user's. There is
# nothing to attach a rule to until a custom domain is added.
#
# So both of the usual atomic limiters are unavailable, and the Worker's own
# counter is the only thing between /api/ask and unmetered billed inference.
# That is why the burst limit is now an atomic D1 upsert rather than the
# best-effort edge-cache counter — see `bumpLimit` in worker/src/index.ts.

[vars]
# Same-origin deploys need no allowlist. Set this only if you split the API onto
# its own Worker/domain, e.g. "https://www.pomodoropet.com".
ALLOWED_ORIGINS = ""
# Model ids are retired on their own schedule, so this is a var rather than a
# constant in the source. Empty means "use the default in worker/src/index.ts".
ASK_MODEL = ""

# ---------------------------------------------------------------------------
# Preview. Every deploy on a branch other than main lands here, on a
# *.petpomo.pages.dev preview URL that no custom domain ever points at.
#
# It gets its own database so testing cannot corrupt or read real players'
# saves. Both blocks below are repeated rather than inherited on purpose:
# d1_databases and vars are non-inheritable, so overriding either one for an
# environment means every non-inheritable key must be restated for it.
# ---------------------------------------------------------------------------
[[env.preview.d1_databases]]
binding = "DB"
database_name = "petpomo-preview"
database_id = "c1ec69f6-c242-4085-8e14-d55335a34a4f"

# Workers AI for /api/ask. Safe to declare here, unlike at the top level:
# `wrangler pages dev` reads the top-level config only, so this binding reaches
# deployed preview without dragging a remote AI connection into local dev.
[env.preview.ai]
binding = "AI"

# No `[env.preview.ratelimits]` either — Pages rejects it in any environment,
# for the reason spelled out above. Preview falls back to the same edge-cache
# counter, against its own separate database.

[env.preview.vars]
ALLOWED_ORIGINS = ""
ASK_MODEL = ""

# ---------------------------------------------------------------------------
# Production. Declared explicitly rather than inherited from the top level,
# because the top level is shared with `wrangler pages dev` and the AI binding
# cannot go there without hanging local dev.
#
# Everything is restated: d1_databases and vars are non-inheritable, so a bare
# `[env.production]` would deploy production with no database at all. The
# database id below is production's, and must stay different from preview's.
# ---------------------------------------------------------------------------
[[env.production.d1_databases]]
binding = "DB"
database_name = "petpomo"
database_id = "f2668cba-dfff-4865-b09a-80dfec61e1e4"

[env.production.ai]
binding = "AI"

[env.production.vars]
ALLOWED_ORIGINS = ""
ASK_MODEL = ""
